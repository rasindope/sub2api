name: Build image

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Optional extra image tag besides key-ranking and git sha
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Image metadata
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          version=$(tr -d '[:space:]' < backend/cmd/server/VERSION)
          sha=$(echo '${{ github.sha }}' | cut -c1-12)
          image="ghcr.io/${owner}/sub2api"
          date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          extra='${{ inputs.extra_tag }}'
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "date=${date_utc}"
            echo "tags<<EOF"
            echo "${image}:key-ranking"
            echo "${image}:${version}"
            echo "${image}:sha-${sha}"
            if [ -n "${extra}" ]; then
              echo "${image}:${extra}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
